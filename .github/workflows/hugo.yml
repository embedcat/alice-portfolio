name: Deploy Hugo site to VPS

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "deploy-vps"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      # Кэш ресайзнутых картинок: без него Hugo пересоздаёт все 105 превью
      # на каждом прогоне (~24 с). Ключ завязан на версию Hugo (у разных
      # версий разная схема имён) и на содержимое assets/images.
      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ env.HUGO_VERSION }}-${{ hashFiles('assets/images/**') }}
          restore-keys: |
            hugo-resources-${{ env.HUGO_VERSION }}-
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify
      # Страховка перед rsync --delete: если сборка вышла пустой или битой,
      # деплой должен упасть здесь, а не выкосить сайт на проде.
      - name: Sanity-check build
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/index/index.html
          test -f public/about/index.html
          files=$(find public -type f | wc -l)
          echo "файлов в сборке: $files"
          test "$files" -gt 100
      # rsync передаёт только изменившиеся файлы и сам удаляет с сервера то,
      # чего больше нет в сборке.
      # --checksum обязателен: Hugo пересоздаёт весь public/ на каждом прогоне,
      # поэтому mtime у всех файлов всегда новый и обычная проверка "размер+время"
      # считала бы изменившимся вообще всё.
      - name: Deploy to VPS via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -rlpt --checksum --delete --human-readable --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            ./public/ "$VPS_USERNAME@$VPS_HOST:/www/alice/public/"
