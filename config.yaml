baseURL: https://alice.rockevents.ru
title: Анастасия Прошкина
locale: ru-RU
defaultContentLanguage: 'ru'
theme: eternity
enableRobotsTXT: true

params:
  image: /images/design/abc.png # картинка по умолчанию для ссылок в соцсетях
  # логотип берётся из assets/images/brand/logo.png (ресайз в partials/navbar.html)
  subtitle: Графический дизайнер, художник
  sitename: Анастасия Прошкина
  author: Анастасия Прошкина
  description: >-
    Анастасия Прошкина — графический дизайнер и художник-сценограф.
    Дизайн детских игрушек и развивающих игр, живопись, графика.
  dontShowSource: true # please, do not do this :)
  portfolio:
    columns:
      desktop:
        design: 3
        graphics: 3
        arts: 3
        archive: 6
        default: 3
      mobile:
        default: 1
  socials:
    - name: 'Написать на почту'
      icon: 'far fa-envelope fa-lg'
      url: 'mailto:alisadesign2020@gmail.com'
    - name: 'Instagram'
      icon: 'fab fa-instagram fa-lg'
      url: 'https://www.instagram.com/anastasiiasmolova1990'
    - name: 'Резюме на hh.ru'
      icon: "far fa-file fa-lg"
      url: 'https://kaluga.hh.ru/resume/78689a34ff08ab96480039ed1f416446714777'
  # relref на файл content/home.md; публичный URL страницы — /index/ (url: index в front matter)
  homepage: "/home"
  specialPages:
    - work
    - archive
  bypassWelcomePage: true # redirects "/" to "homepage" when it's true.
  disableWelcomePageBackground: false # disables the background image on the homepage
  disableRadius: true
  moveIt: true  # Moves Title and Meta info down, only visible when scroll.
  disableAlwaysResize: false

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: tags

permalinks:
  work: ":filename/"

menu:
  main:
    - name: главная
      url: /index/
      weight: 10
    - name: обо мне
      url: /about/
      weight: 20
    - name: дизайн
      url: /tags/design/
      weight: 30
    - name: живопись
      url: /tags/arts/
      weight: 40
    - name: графика
      url: /tags/graphics/
      weight: 50
    - name: галерея
      url: /tags/archive/
      weight: 60
