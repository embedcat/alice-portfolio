name: Deploy Hugo site to VPS

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "deploy-vps"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify
      # Заливаем сборку во временный каталог: rm:true чистит его перед копированием,
      # поэтому в staging никогда не остаётся мусор от прошлых версий.
      - name: Upload build to staging dir on VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_KEY }}
          source: "./public"
          target: /www/alice/staging/
          rm: true
      # Подменяем каталог целиком (два mv ≈ мгновенно), старая версия удаляется
      # только после успешной подмены. Это выкидывает файлы, которых больше нет
      # в сборке, — SCP сам по себе ничего не удаляет.
      - name: Swap staging into place
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            if [ ! -d /www/alice/staging/public ]; then
              echo "staging/public не найден — деплой прерван, прод не тронут" >&2
              exit 1
            fi
            rm -rf /www/alice/public.old
            if [ -d /www/alice/public ]; then
              mv /www/alice/public /www/alice/public.old
            fi
            if ! mv /www/alice/staging/public /www/alice/public; then
              echo "подмена не удалась — откатываемся на прошлую версию" >&2
              [ -d /www/alice/public.old ] && mv /www/alice/public.old /www/alice/public
              exit 1
            fi
            rm -rf /www/alice/public.old /www/alice/staging
